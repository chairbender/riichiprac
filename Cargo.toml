[package]
name = "riichiprac"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Native-only replay-miner foundation (F1) and replay library (R1). This feature must never be enabled
# for the shipped WASM build: it pulls in a CLI, SQLite and file I/O. See
# `replay-miner-operations.md`.
miner = ["dep:clap", "dep:flate2", "dep:rusqlite", "dep:sha2", "dep:thiserror", "dep:rayon"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
agari = { git = "https://github.com/agari-industries/agari" }
js-sys = "0.3.107"
# Candle: pure-Rust inference. `default-features = false` keeps the CUDA/Metal/MKL
# backends (and their native C toolchains) out of the browser build.
candle-core = { version = "0.8", default-features = false }
candle-nn = { version = "0.8", default-features = false }
# Miner-only dependencies. `bundled` compiles SQLite from source so the offline
# tool does not depend on a system sqlite3 library.
clap = { version = "4", features = ["derive"], optional = true }
# Gzip is the corpus replay container (R1). The default `rust_backend` keeps a
# C zlib out of the native build.
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
rusqlite = { version = "0.43", features = ["bundled"], optional = true }
sha2 = { version = "0.10", optional = true }
thiserror = { version = "1", optional = true }
# Native-only CPU parallelism for the offline miner stages. Kept under the
# `miner` feature so the browser build never links a thread pool.
rayon = { version = "1", optional = true }

[[bin]]
name = "mine_replays"
path = "src/bin/mine_replays.rs"
# A plain `cargo build`/`cargo check` must not build the miner CLI.
required-features = ["miner"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
# candle pulls in rand 0.9 -> getrandom 0.3. On wasm32-unknown-unknown getrandom
# only compiles with the `wasm_js` backend (paired with the rustflags in
# .cargo/config.toml).
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.80"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
