name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for Pages: read the repo, write the Pages deployment, and let
# the deploy step mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; never cancel a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # P2 optional CI copy step: an audited pack export can be published as a
      # GitHub Release asset. Release assets send no access-control-allow-origin
      # header (hosting-plan.md), so the browser cannot fetch them from Pages;
      # CI downloads the manifest and bodies server-side and Pages serves them
      # same-origin. Set the repository variable PACK_RELEASE_TAG to enable it.
      # The downloaded set replaces the committed smoke pack in the CI workspace
      # (never on disk in the repo), so an old body cannot linger unlisted.
      - name: Fetch published scenario packs (optional)
        if: vars.PACK_RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_RELEASE_TAG: ${{ vars.PACK_RELEASE_TAG }}
        run: |
          rm -rf frontend/public/scenarios
          mkdir -p frontend/public/scenarios
          gh release download "$PACK_RELEASE_TAG" \
            --pattern 'manifest.json' --pattern '*.json.gz' \
            --dir frontend/public/scenarios --clobber
          ls -l frontend/public/scenarios

      - name: Install Rust toolchain (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # NOTE: wasm-pack runs wasm-opt on release builds. This module is large
      # (candle + safetensors), so if this job starts running out of memory or
      # timing out, add `--no-opt` to the wasm-pack command below and record the
      # reason in hosting-plan.md ("MIME / wasm-opt conclusions"). Do not disable
      # it silently: the optimized module is what ships to browsers.
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      # The frontend imports the freshly built ./pkg via `file:../pkg`, so this
      # must run from the repo root before `npm ci` in frontend/.
      - name: Build WASM package
        run: wasm-pack build --target web --release

      # GitHub release assets are NOT CORS-enabled (no access-control-allow-origin
      # on github.com or release-assets.githubusercontent.com), so the browser
      # cannot fetch the weights from the Pages origin. Download them here,
      # server-side, and let Pages serve the file same-origin instead. The file is
      # gitignored and never committed; it only lands in the Pages artifact.
      # A missing release must not block the deploy: the app degrades to
      # book-only grading when the weights are unavailable.
      - name: Fetch Mortal weights for same-origin hosting
        run: |
          mkdir -p frontend/public/models
          curl -fL --retry 3 --retry-delay 2 \
            -o frontend/public/models/mortal_298k.safetensors \
            https://github.com/chairbender/riichiprac/releases/download/weights-v1/mortal_298k.safetensors \
            || echo "::warning::Mortal weights unavailable; the deployed AI panel will report them as missing."
          ls -l frontend/public/models/

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # CI uses Node 20 (local dev is on 18); Vite 5 and the Pages actions
          # are supported on both, but 20 is the current LTS for Actions.
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # P2: the staged hosting directory is exactly one same-origin manifest
      # plus content-addressed gzip bodies within the 50 MB budget. This checks
      # the manifest/body hashes, byte counts, metadata drift, the ai_selfplay
      # source, and that no raw replay, database or weights file rides along.
      # It runs before the build so a broken export never reaches Pages.
      - name: Verify staged scenario packs
        run: node scripts/check-pack-hosting.mjs

      # `GITHUB_ACTIONS` is set by the runner, so vite.config.ts picks the
      # `/riichiprac/` base path automatically. The 43 MB weights file is NOT
      # needed here: it is gitignored and fetched from an external CDN at
      # runtime (see hosting-plan.md).
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Vite copies frontend/public verbatim. Re-run the same check on the
      # built artifact, which proves Pages will include the packs at
      # /riichiprac/scenarios/ rather than only that the source exists.
      - name: Verify the Pages artifact includes the packs
        run: node scripts/check-pack-hosting.mjs --dir frontend/dist/scenarios

      # The loader verifies the stored gzip bytes before decompressing. A
      # static server that infers `Content-Encoding: gzip` from the `.json.gz`
      # extension makes the browser decompress the body and the loader's byte/
      # SHA check fails. Vite dev/preview use the rawScenarioPackBodies
      # middleware; this runs the preview server and asserts the headers and
      # bytes a browser would actually receive.
      - name: Verify pack bodies are served raw
        run: node scripts/check-pack-serving.mjs

      # Optional R2/HF mirror: the same-origin manifest stays on Pages, and the
      # loader tries same-origin first. A mirror is only usable by a browser
      # when it sends CORS headers, so measure them (and, when configured, the
      # exact audited bytes) rather than trust the provider's docs. Set the
      # repository variable PACK_MIRROR_BODY_URL to enable this step.
      - name: Check the external pack mirror's CORS headers (optional)
        if: vars.PACK_MIRROR_BODY_URL != ''
        run: node scripts/check-pack-cors.mjs --url "${{ vars.PACK_MIRROR_BODY_URL }}"

      # The 3D face carve (relief3d atlases + manifest) and the glyph masters it
      # samples are committed. No Blender or browser is involved: --check
      # validates the atlas byte/hash pins, and the dependency-free glyph
      # checker validates the masters against faces.json.
      - name: Verify the 3D carve atlases
        run: node frontend/tools/relief3d/bake-relief3d.mjs --check

      - name: Verify the glyph masters
        run: node tools/render/scripts/check-faces.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
